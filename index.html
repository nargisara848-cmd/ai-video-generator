<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Arman AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#000;
color:#fff;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
padding:30px 20px;
}

h1{
color:#ff1a1a;
font-size:38px;
}

p{
color:#ccc;
}

textarea{
width:90%;
height:120px;
padding:15px;
border-radius:10px;
border:none;
font-size:16px;
}

input,select{
width:90%;
padding:12px;
margin-top:15px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
margin-top:20px;
padding:15px 35px;
background:red;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#cc0000;
}

.card{
background:#111;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(255,0,0,.4);
}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🔥 Nova Arman AI</h1>

<p>Create Amazing AI Videos</p>

<textarea placeholder="Describe your video..."></textarea>

<input type="file">

<select>
<option>5 Seconds</option>
<option>10 Seconds</option>
<option>15 Seconds</option>
<option>20 Seconds</option>
</select>

<select>
<option>Realistic</option>
<option>Anime</option>
<option>Cinematic</option>
<option>3D</option>
</select>

<button>🎬 Generate Video</button>

</div>

</div>

</body>
</html>
